<!-- editor: _includes/editor/scroll-to-top.html
     Same behavior and id as OHD's _includes/scroll-to-top.html (OHD's transcript-js.html
     attaches to #scroll-to-top), with the arrow drawn inline instead of from the
     cb-icons.svg sprite, and a scroll listener that can't be overwritten by window.onscroll. -->
<button id="scroll-to-top" type="button" class="btn btn-link no-print" title="Back to Top" aria-label="Back to Top"
  onclick="window.scroll({ top: 0, left: 0, behavior: 'smooth' });">
  <svg viewBox="0 0 16 16" aria-hidden="true"><path fill-rule="evenodd" d="M15 2a1 1 0 0 0-1-1H2a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1zM0 2a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2zm8.5 9.5a.5.5 0 0 1-1 0V5.707L5.354 7.854a.5.5 0 1 1-.708-.708l3-3a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 5.707z"/></svg>
</button>
<script>
  (function () {
    var btn = document.getElementById('scroll-to-top');
    function toggle() { btn.style.display = window.scrollY > 500 ? 'block' : 'none'; }
    window.addEventListener('scroll', toggle, { passive: true });
    toggle();
  })();
</script>
