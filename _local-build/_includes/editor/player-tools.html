<!-- editor: _includes/editor/player-tools.html
     Editor-only controls under the OHD player, also shown in the scrolling mini player.
     Buttons flash when used, by mouse or keyboard (editor-js.html, editor-style.html). -->
{% assign skip = site.editor.skip_seconds | default: 5 %}
<div id="editor-tools" class="d-flex flex-wrap align-items-center gap-2 small mt-2 no-print">
  <div class="btn-group btn-group-sm" role="group" aria-label="Skip back or forward">
    <button type="button" class="btn btn-outline-secondary" data-skip="-1" aria-label="Back {{ skip }} seconds">&minus;{{ skip }}s</button>
    <button type="button" class="btn btn-outline-secondary" data-skip="1" aria-label="Forward {{ skip }} seconds">+{{ skip }}s</button>
  </div>
  <span class="editor-speed-label text-muted">Speed</span>
  <div class="btn-group btn-group-sm" role="group" aria-label="Playback speed">
    <button type="button" class="btn btn-outline-secondary" data-speed="-1" aria-label="Slower">&minus;</button>
    <button type="button" class="btn btn-outline-secondary" id="editor-rate" aria-label="Playback speed 1 times. Select for normal speed">1&times;</button>
    <button type="button" class="btn btn-outline-secondary" data-speed="1" aria-label="Faster">+</button>
  </div>
  <span id="editor-rate-pop" class="editor-rate-pop" aria-hidden="true"></span>
  {%- comment -%} fallback only: editor-js shows this when the page has no OHD Reset Filters button {%- endcomment -%}
  {% if site.data.filters %}<button type="button" id="editor-reset" class="btn btn-sm btn-outline-primary d-none">Reset filters</button>{% endif %}
  <span id="editor-announce" class="visually-hidden" aria-live="polite"></span>
</div>
{% include editor/key-guide.html size="mini" %}
