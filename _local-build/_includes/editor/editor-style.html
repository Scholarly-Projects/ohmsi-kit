<!-- editor: _includes/editor/editor-style.html (editor-only additions; OHD styles come from cb.css) -->
<style>
  /* header, approximating the OHD collection banner */
  .editor-site-title { font-size: calc(1.375rem + 1.5vw); line-height: 1.2; }
  @media (min-width: 1200px) { .editor-site-title { font-size: 2.5rem; } }
  .editor-site-description { font-size: 1.15rem; }
  .editor-icon { width: 1em; height: 1em; fill: currentColor; vertical-align: -0.125em; }
  .editor-nav { height: 2.5rem; flex-shrink: 0; } /* empty, so keep the body's flex column from collapsing it */

  /* player controls (editor/player-tools.html) */
  #editor-tools .btn { transition: background-color .4s ease, border-color .4s ease, color .4s ease; }
  #editor-tools .btn.editor-flash { background: #FEF44E; border-color: #000; color: #000; transition: none; }
  #editor-rate { min-width: 3.6em; font-variant-numeric: tabular-nums; }
  /* the speed as a percentage, shown briefly after each change, then collapsing */
  .editor-rate-pop { display: inline-block; max-width: 0; overflow: hidden; white-space: nowrap; vertical-align: middle;
    padding: 0; border-radius: .25rem; background: #FEF44E; color: #000; font-weight: 600; font-variant-numeric: tabular-nums;
    transition: max-width .35s ease, padding .35s ease; }
  .editor-rate-pop.show { max-width: 6em; padding: .1rem .45rem; }

  /* keyboard guides (editor/key-guide.html): full size above the player, small under the mini player */
  .editor-key-guide { font-size: .85rem; color: #6c757d; }
  .editor-key-guide kbd { background: #fff; color: #212529; border: 1px solid #adb5bd; border-bottom-width: 2px;
    border-radius: .25rem; padding: 0 .3em; font-size: .85em; font-family: inherit; box-shadow: none; }
  .editor-key-guide .sep { margin: 0 .35em; }
  .editor-key-guide[data-size="mini"] { display: none; font-size: .75rem; }

  /* scrolling mini player: keep the controls, swap the full guide for the small one */
  .media-scroll-wrapper #editor-tools { margin-top: .25rem !important; gap: .35rem !important; }
  .media-scroll-wrapper #editor-tools .editor-speed-label,
  .media-scroll-wrapper #editor-tools #editor-reset,
  .media-scroll-wrapper .editor-key-guide[data-size="full"] { display: none !important; }
  .media-scroll-wrapper .editor-key-guide[data-size="mini"] { display: block; }

  /* back-to-top button (editor/scroll-to-top.html) */
  #scroll-to-top { display: none; position: fixed; bottom: 20px; right: 30px; z-index: 1030; padding: 0; color: var(--bs-link-color, #0d6efd); }
  #scroll-to-top svg { width: 2.5rem; height: 2.5rem; fill: currentColor; }

  /* transcript lines */
  #contents-container .line { scroll-margin-top: 8rem; border-left: 4px solid transparent; }
  #contents-container .line:focus-within { background: rgba(0, 0, 0, .05); }
  #contents-container .line.editor-current { background: #FEF44E; border-left-color: #000000; }
  #contents-container .line.editor-flagged { border-left-color: #dc3545; }
  #contents-container .line.editor-flagged.editor-current { border-left-color: #000000; }
  #contents-container .timestamp-link:focus-visible,
  #contents-container a.csv-line:focus-visible { outline: 3px solid #000; outline-offset: 2px; border-radius: 2px; }
  .csv-line { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .75rem; color: #6c757d; }
  a.csv-line { display: inline-block; text-decoration: none; }
  a.csv-line:hover { color: #000; text-decoration: underline; }
  .editor-flag { font-weight: normal; white-space: normal; text-align: left; }
  .editor-details summary { cursor: pointer; }

  @media (prefers-reduced-motion: reduce) {
    #editor-tools .btn, .editor-rate-pop { transition: none; }
  }
  @media print { .csv-line, .editor-flag { display: none !important; } }
</style>
