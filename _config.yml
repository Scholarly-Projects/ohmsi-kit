##########
# Transcript editing workspace
# Local-only Jekyll build, adapted from the Oral History as Data template
# https://github.com/uidaholib/oral-history-collections-template
#
# Usage: drop ONE transcript CSV into C/, keep its recording in A/
# (same filename, e.g. A/interview01.wav <-> C/interview01.csv), then run
#   bundle exec jekyll s
##########

title: Transcript Editing Workspace
description: Local copy-editing workspace for transcripts generated by the toolkit.

# No production URL: this site is only ever served locally.
url: ""
baseurl: ""

# Bootstrap, fonts and JS are loaded from here by head.html and foot.html
# (needs an internet connection; see docs/editing_workspace.md to run offline)
digital-assets: https://www.lib.uidaho.edu/assets

##########
# EDITOR SETTINGS
#
editor:
  # folder holding the single CSV being edited
  transcript_dir: C
  # folder holding the original recordings
  audio_dir: A
  # if a recording exists in several formats, use the first one found in this order
  audio_preference: [mp3, m4a, wav, flac]

##########
# LOCAL SERVER SETTINGS
#
# reload the browser automatically each time the CSV is saved
livereload: true
# open the workspace in the default browser when the server starts
open_url: true

##########
# BUILD SETTINGS
#
# Keep the Python toolkit, the audio library and the generated CSVs out of _site.
# (The one recording that matches the CSV in C/ is added by the editor plugin.)
# Do NOT exclude C/: Jekyll only watches for saves in folders that are included.
exclude:
  - A/
  - B/
  - docs/
  - "*.py"
  - requirements.txt
  - README.md
  - LICENSE
  - venv/
  - .venv/
  - __pycache__/
  - legacy_python/

sass:
  style: compressed
