##########
# Oral History Multi-Speaker Interpretation-Kit: transcript editing workspace
# A local-only Jekyll build of the Oral History as Data (OHD) item page
# https://github.com/uidaholib/oral-history-collections-template
#
# Usage: copy ONE transcript CSV into C/, keep its recording in A/ under the same
# name (A/interview01.wav <-> C/interview01.csv), then from this folder run
#   bundle exec jekyll s
# and open the "Workspace:" address printed in the terminal.
##########

# shown in the header of the workspace page
title: Oral History Multi-Speaker Interpretation-Kit
description: Local copy-editing workspace for transcripts generated by the toolkit.

# No production URL: this site is only ever served locally.
url: ""
baseurl: ""

# Bootstrap, fonts and JS are loaded from here by head.html and foot.html
# (needs an internet connection; see docs/editing_workspace.md to run offline)
digital-assets: https://www.lib.uidaho.edu/assets

##########
# EDITOR SETTINGS
#
editor:
  # the single CSV being edited
  transcript_dir: C
  # the original recordings
  audio_dir: A
  # everything Jekyll needs (layouts, includes, plugins, styles, theme data, assets)
  build_dir: _local-build
  # if a recording exists in several formats, use the first one found in this order
  audio_preference: [mp3, m4a, wav, flac]
  # Make a constant-bitrate MP3 copy of the recording for playback, using ffmpeg.
  # The OHD player is an MP3 player, and the copy seeks reliably in every browser.
  #   auto   - for WAV, FLAC and M4A recordings (default)
  #   always - for every recording, including MP3s
  #   never  - play the original file
  # The copy is made once per recording and kept in .jekyll-cache/editor-audio/.
  playback_copy: auto

  # PLAYBACK CONTROLS
  # seconds moved by the back / forward buttons and keys
  skip_seconds: 5
  # speeds the faster / slower buttons and keys step through
  speeds: [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2]
  # seconds replayed by the loop button and key
  loop_seconds: 5

  # KEYBOARD SHORTCUTS
  # One key per action, or a list such as [n, j]. Use letters or digits as typed,
  # Space, or a key name: ArrowLeft, ArrowRight, ArrowUp, ArrowDown, Enter, Escape.
  # Leave an action empty ("") to turn its shortcut off. The keyboard guide on the
  # page updates to match. Shortcuts are ignored while typing in the search box or
  # choosing from a menu.
  keys:
    play_pause: Space
    back: ArrowLeft
    forward: ArrowRight
    faster: i
    slower: d
    normal_speed: "0"
    next_line: n
    previous_line: p
    loop: l                 # loop the last loop_seconds; press again to stop
    continue: c             # end a loop and carry on playing from that point
    copy_time: t            # copy the current playback time, e.g. 00:12:03

  # LINE NUMBERS
  # Selecting a grey line number under a timestamp opens the CSV at that line in
  # this editor: vscode, vscode-insiders, cursor or vscodium. Use "none" to turn
  # the links off.
  open_in: vscode


##########
# WHERE JEKYLL'S FILES LIVE
#
# Jekyll reads the toolkit root (so it notices saves in C/), but keeps all of its own
# files in _local-build/.
layouts_dir: _local-build/_layouts
includes_dir: _local-build/_includes
data_dir: _local-build/_data
plugins_dir: _local-build/_plugins
destination: _local-build/_site
sass:
  sass_dir: _local-build/_sass
  style: compressed

##########
# LOCAL SERVER SETTINGS
#
# reload the browser automatically each time the CSV is saved
livereload: true

##########
# BUILD SETTINGS
#
# Keep the Python toolkit, the recordings, and the generated and finished CSVs out of the
# build and stop Jekyll rebuilding when they change. (The recording that matches the CSV
# in C/ is added by the editor plugin.)
# Do NOT exclude C/: Jekyll only watches for saves in folders that are included.
exclude:
  - A/
  - B/
  - D/
  - docs/
  - "*.py"
  - requirements.txt
  - README.md
  - LICENSE
  - venv/
  - .venv/
  - __pycache__/
  - legacy_python/